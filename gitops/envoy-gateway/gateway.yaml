apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.dglobaleng.com.ng"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTP  # Changed from HTTPS to HTTP because AWS NLB handles the SSL termination
      port: 443
      hostname: "*.dglobaleng.com.ng"
      allowedRoutes:
        namespaces:
          from: All