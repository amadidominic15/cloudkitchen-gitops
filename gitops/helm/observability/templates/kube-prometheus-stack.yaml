{{- if .Values.applications.kubePrometheusStack.enabled }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.applications.kubePrometheusStack.repoURL }}
    chart: {{ .Values.applications.kubePrometheusStack.chart }}
    targetRevision: {{ .Values.applications.kubePrometheusStack.version | quote }}
    helm:
      releaseName: {{ .Values.applications.kubePrometheusStack.releaseName }}
      values: |
        {{- toYaml .Values.applications.kubePrometheusStack.values | nindent 8 }}
  destination:
    server: {{ .Values.argocd.destination.server }}
    namespace: {{ .Values.applications.kubePrometheusStack.namespace }}
  syncPolicy:
    {{- toYaml .Values.argocd.syncPolicy | nindent 4 }}

{{- end }}