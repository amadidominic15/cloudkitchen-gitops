argocd:
  project: cloudkitchen
  repoURL: https://github.com/amadidominic15/cloudkitchen-gitops.git
  targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

applications:
  # ==========================================================
  # 1. KUBE PROMETHEUS STACK
  # ==========================================================
  kubePrometheusStack:
    enabled: true
    namespace: observability
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: "92.10.0"
    releaseName: kube-prometheus-stack
    values: # ◄--- ALL SUB-CHART CONFIGS MUST NEST UNDER THIS BLOCK
      
      # a. Kube-State-Metrics Configuration
      kube-state-metrics:
        enabled: true

      # b. Node-Exporter Configuration
      prometheus-node-exporter: 
        enabled: true

      # c. Grafana Configuration
      grafana:
        enabled: true
        replicas: 1
        grafana:
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL
        persistence:
          enabled: true
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          size: 10Gi
        service:
          type: ClusterIP
          port: 80
        additionalDataSources:
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki-gateway.observability.svc.cluster.local
            isDefault: false
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3200
            isDefault: false
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi

      # d. Prometheus Engine Configuration
      prometheus:
        enabled: true
        prometheusSpec:
          replicas: 1
          retention: 15d
          scrapeInterval: 30s
          evaluationInterval: 30s
          serviceMonitorSelector: {}
          podMonitorSelector: {}
          serviceMonitorNamespaceSelector: {}
          podMonitorNamespaceSelector: {}
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1Gi

      # e. Alertmanager Configuration
      alertmanager:
        enabled: true
        alertmanagerSpec:
          replicas: 1
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 5Gi
          resources:
            requests:
              cpu: 250m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1Gi

  # ==========================================================
  # 2. LOKI - LOG STORAGE
  # ==========================================================
  loki:
    enabled: true
    namespace: observability
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    version: "18.5.0"
    releaseName: loki
    values:
      deploymentMode: Monolithic
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h

        storage:
          type: s3
          bucketNames:
            chunks: "dev-cloudkitchen-eu-north-1-loki-chunks-10-26"
            ruler: "dev-cloudkitchen-eu-north-1-loki-ruler-10-26"
          s3:
            region: eu-north-1
        limits_config:
          allow_structured_metadata: true
          retention_period: 336h
        compactor:
          retention_enabled: true
          delete_request_store: s3

      serviceAccount:
        create: true
        name: loki

      singleBinary:
        replicas: 1
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
           cpu: 500m
           memory: 1Gi

        persistence:
          enabled: true
          storageClass: gp3
          accessModes:
            - ReadWriteOnce
          size: 20Gi

      gateway:
        enabled: true
      minio:
        enabled: false
      backend:
        replicas: 0
      read:
        replicas: 0
      write:
        replicas: 0
  # ==========================================================
  # 3. TEMPO - DISTRIBUTED TRACING STORAGE
  # ==========================================================
  tempo:
    enabled: true
    namespace: observability
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    version: "2.3.0"
    releaseName: tempo
    values:
      serviceAccount: #AWS permission through EKS Pod Identity
        create: true
        name: tempo

      persistence:
        enabled: true
        storageClassName: gp3
        size: 10Gi

      tempo:
        reportingEnabled: false
        metricsGenerator:
          enabled: true
        distributor:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

        storage:
          trace:
            backend: s3
            s3:
              bucket: "dev-cloudkitchen-eu-north-1-tempo-10-26"
              endpoint: s3.eu-north-1.amazonaws.com
              region: eu-north-1
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 512m
            memory: 1Gi
# ==========================================================
# 4. GRAFANA ALLOY - KUBERNETES LOG COLLECTION
# ==========================================================
  alloy:
    enabled: true
    namespace: observability
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    version: "1.12.1"
    releaseName: alloy
    values:
      controller:
        type: daemonset
      alloy:
        enableReporting: false
        configMap:
          create: true
          content: |
            logging {
              level  = "info"
              format = "logfmt"
            }
            discovery.kubernetes "pods" {
              role = "pod"
            }
            loki.source.kubernetes "pods" {
              targets    = discovery.kubernetes.pods.targets
              forward_to = [loki.write.local.receiver]
            }
            loki.write "local" {
              endpoint {
                url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
              }
            }
      serviceAccount: #The permissions allow Alloy to discover workloads and collect their logs through the Kubernetes API
        create: true
        name: alloy
      rbac:
        create: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi




