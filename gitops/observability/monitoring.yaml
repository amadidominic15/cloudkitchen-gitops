apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "88.6.1"
    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          enabled: true
          replicas: 2
          service:
            type: ClusterIP
            port: 80
          grafana.ini:
            server:
              root_url: https://grafana.example.com
              domain: grafana.example.com
          persistence:
            enabled: true
            storageClassName: gp3
            accessModes: [ReadWriteOnce]
            size: 20Gi
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              isDefault: true
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.loki.svc.cluster.local:80
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
        prometheus:
          enabled: true
          service:
            type: ClusterIP
            port: 9090
          prometheusSpec:
            replicas: 2
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 50Gi
            resources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {cpu: "2", memory: 4Gi}
        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 2
        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: 
      CreateNamespace: true
