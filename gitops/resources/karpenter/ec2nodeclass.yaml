apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cloudkitchen-general
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: dev-cloudkitchen-eu-north-1-eks-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-cloudkitchen-eu-north-1-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-cloudkitchen-eu-north-1-eks
  tags:
    Project: cloudkitchen
    Environment: production
    ManagedBy: karpenter