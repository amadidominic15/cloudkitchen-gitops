apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: cloudkitchen
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      releaseName: tempo
      values: |
        serviceAccount:
          create: true
          name: tempo
        tempo:
          structuredConfig:
            distributor:
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
                    http:
                      endpoint: 0.0.0.0:4318
            storage:
              trace:
                backend: s3
                s3:
                  bucket: "dev-cloudkitchen-eu-north-1-tempo-10-26"
                  endpoint: s3.eu-north-1.amazonaws.com
                  region: eu-north-1
        persistence:
          enabled: true
          storageClassName: gp3
          size: 10Gi
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true