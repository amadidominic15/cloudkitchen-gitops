apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd

spec:
  project: cloudkitchen

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.2"

    helm:
      releaseName: opentelemetry-collector

      values: |
        mode: deployment
        replicaCount: 2
        image:
          repository: otel/opentelemetry-collector-contrib
        service:
          enabled: true
          type: ClusterIP
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            memory_limiter:
              check_interval: 1s
              limit_percentage: 75
              spike_limit_percentage: 15
            batch:
              send_batch_size: 1024
              timeout: 5s
            k8sattributes:
              auth_type: serviceAccount
              extract:
                metadata:
                  - k8s.namespace.name
                  - k8s.pod.name
                  - k8s.deployment.name
                  - k8s.node.name
          exporters:
            otlp/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
            otlphttp/loki:
              endpoint: http://loki-gateway.loki.svc.cluster.local/otlp
          service:
            pipelines:
              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - k8sattributes
                  - batch
                exporters:
                  - otlp/tempo
              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - k8sattributes
                  - batch
                exporters:
                  - otlphttp/loki
        clusterRole:
          create: true
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - namespaces
                - nodes
              verbs:
                - get
                - list
                - watch
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true