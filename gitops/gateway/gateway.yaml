apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: public-gateway
  namespace: envoy-gateway-system

spec:

  gatewayClassName: envoy

  listeners:

    - name: https

      protocol: HTTP

      port: 80

      hostname: "*.example.com"

      allowedRoutes:
        namespaces:
          from: All