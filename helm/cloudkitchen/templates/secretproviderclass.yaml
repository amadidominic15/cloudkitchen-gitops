apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.secretProviderClass }}
  namespace: {{ .Values.namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "dev/cloudkitchen/application"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_USER
            objectAlias: DB_USER
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: REDIS_PASSWORD
            objectAlias: REDIS_PASSWORD
  secretObjects:
    - secretName: cloudkitchen-app-secrets
      type: Opaque
      data:
        - objectName: DB_USER
          key: DB_USER
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: REDIS_PASSWORD
          key: REDIS_PASSWORD
